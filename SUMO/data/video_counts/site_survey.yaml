exits:                           # nhánh ra khỏi nút; bề rộng làn ra cũng là bề rộng lòng nút
  LVL_W_out: {lane_widths_m: null, source: null}
  LVL_E_out: {lane_widths_m: null, source: null}
  HDT_N_out: {lane_widths_m: null, source: null}
  HDT_S_out: {lane_widths_m: null, source: null}

# Hai lựa chọn sau khi xem cả hai video:
illegal_left_approaches_seen: null   # nhánh nào thấy xe rẽ trái trái phép, ví dụ [HDT_N, HDT_S]
