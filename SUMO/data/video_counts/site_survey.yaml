      - {name: "mốc 30 m (đầu làn rẽ phải liên tục)", dist_m: 30, what: null}
      - {name: null, dist_m: null, what: null}
      - {name: null, dist_m: null, what: null}
      - {name: null, dist_m: null, what: null}
