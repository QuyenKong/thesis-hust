# Thông tin video. Điền trước khi đếm.
video_id: V1
file: null                 # tên tệp video
date: null                 # ngày quay, "YYYY-MM-DD"
weekday: null              # thứ mấy
clock_start: null          # giờ thực ở giây 00:00 của video, "hh:mm:ss"
duration: null             # "mm:ss"
weather: null              # nắng / mưa / khô ráo...
camera:
  position: null           # đứng ở đâu, nhìn về hướng nào
  height: null             # mặt đất / tầng mấy
  fixed: null              # true nếu camera đứng yên suốt video

# Camera thấy được gì ở từng nhánh. true/false; queue_visible_m: hàng chờ thấy tới cách vạch bao nhiêu m.
visibility:
  LVL_W: {stop_line: null, mark_30m: null, queue_visible_m: null, junction_box: null, sidewalk: null, exit: null}
  LVL_E: {stop_line: null, mark_30m: null, queue_visible_m: null, junction_box: null, sidewalk: null, exit: null}
  HDT_N: {stop_line: null, mark_30m: null, queue_visible_m: null, junction_box: null, sidewalk: null, exit: null}
  HDT_S: {stop_line: null, mark_30m: null, queue_visible_m: null, junction_box: null, sidewalk: null, exit: null}

countdown_display: null    # true nếu thấy đồng hồ đếm ngược của đèn
notes: null                # xe buýt/xe tải nhiều, sự cố, CSGT điều khiển tay...
