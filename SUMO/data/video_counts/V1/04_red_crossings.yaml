# Xe qua vạch dừng khi đèn của nhánh đang đỏ, và xe đầu tiên qua vạch sau khi xanh. Dùng cho M2
# (xuất phát sớm) và M3 (vượt đèn đỏ). 1 lượt xem cho mỗi nhóm đèn, chỉ xem trong lúc nhóm đó đỏ.
#
# red_crossings: mỗi xe một dòng. Tính xe đầu xe vượt hẳn vạch dừng và đi tiếp vào nút trong lúc đèn
#   đỏ (không tính xe chỉ nhích qua vạch rồi đứng lại: xe đó vào n_moto_past_stopline ở tệp 03).
#   Không tính xe rẽ phải ở làn rẽ phải tự do. Không tính xe qua vạch lúc đèn vàng.
#   Script tự phân loại: qua vạch trong 10 s cuối trước khi xanh = xuất phát sớm (M2), sớm hơn = vượt
#   đỏ (M3). Vì vậy chỉ cần ghi đúng thời điểm.
# movement: s | l | u | illegal_l
# first_after_green: thời điểm xe đầu tiên qua vạch tính từ lúc đèn xanh (không tính xe đã chạy từ
#   lúc đỏ). Mỗi nhánh mỗi chu kỳ một dòng.

