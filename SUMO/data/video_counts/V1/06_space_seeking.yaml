# Xe tìm khoảng trống để vượt hàng chờ. Chỉ làm ở nhánh F2 (site_survey.yaml f2_approaches): nhánh
# camera thấy 50-100 m hàng chờ và vỉa hè. Dùng cho M9, M10 và xác suất chọn khoảng trống theo độ dài
# hàng chờ. 1 lượt xem cho mỗi nhánh F2.
#
# events: mỗi lần một xe rời hàng chờ của làn đúng để vào chỗ khác, ghi một dòng:
#   space: right_lane  = xe đi thẳng chen vào làn 0 (làn rẽ phải liên tục) để vượt hàng
#          sidewalk    = xe máy leo lên vỉa hè
#          wrong_lane  = xe rẽ (trái/quay đầu) đi làn không đúng hướng để vượt hàng, rồi cắt về
#          opposite    = lấn sang phần đường ngược chiều (ngoài phạm vi mô phỏng, chỉ ghi để báo cáo)
#   queue_back: đuôi hàng chờ của làn đúng lúc đó (mốc hoặc số m)
#
# lane0_blocks: mỗi xe đi thẳng đứng trên làn 0 làm xe rẽ phải phía sau phải dừng (M9):
#   t_start lúc xe rẽ phải đầu tiên bị chặn phải dừng, t_end lúc làn 0 thông lại.
#
# queue_every_10s: đuôi hàng chờ ở các phút :00, :10, :20... của video.

