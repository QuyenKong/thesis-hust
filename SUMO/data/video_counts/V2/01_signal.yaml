# Mốc đổi đèn. 1 lượt xem.
# Ghi MỌI lần một nhóm đèn đổi màu, theo thứ tự thời gian. Nhìn đèn trực tiếp, hoặc suy ra từ đồng hồ
# đếm ngược, hoặc từ lúc dòng xe bắt đầu/dừng (ghi how: inferred).
#
# Nhóm đèn (thứ tự pha đã ghi nhận tại hiện trường 28/10):
#   LVL_straight : LVL_W + LVL_E đi thẳng (và rẽ phải nếu có đèn)
#   LVL_left     : mũi tên rẽ trái của LVL_W + LVL_E (LVL đi thẳng đỏ trong pha này)
#   HDT          : HDT_N + HDT_S
# Nếu thấy HDT_N và HDT_S xanh lệch nhau, ghi riêng group: HDT_N / HDT_S.
# state: G (xanh) | y (vàng) | r (đỏ). Đỏ toàn phần = khoảng giữa lúc nhóm trước sang r và nhóm sau sang G.
# how: seen (thấy đèn) | countdown (đọc đồng hồ đếm ngược) | inferred (suy từ dòng xe)

# Đo tự động 26/11 (video/runs/V2_IMG_4801/light_rgb.csv): cột đèn 2 màu đỏ/xanh, không có vàng, ở góc
# cửa hàng Đạt Bike (ảnh tham chiếu ổn định, pixel (672, 925)); màu đọc mỗi 0,5 s qua homography. Nhiều khả
# năng là đèn người đi bộ qua LVL, xanh trùng lúc NT xả hàng (pha đường ngang NT/HMG). Chu kỳ 160,0 s.
# Pha LVL (đi thẳng cả hai nhánh, rồi rẽ trái cả hai nhánh, đi thẳng đỏ) theo mô tả hiện trường của Viktor
# 26/11; thời lượng hai pha LVL chưa đo được: dòng xe LVL bị tắc nên không suy pha từ dòng xe được.
events:
  - {t: "00:39.5", group: PED_LVL, state: G, how: seen}
  - {t: "01:12.5", group: PED_LVL, state: r, how: seen}
  - {t: "03:19.5", group: PED_LVL, state: G, how: seen}
  - {t: "03:52.5", group: PED_LVL, state: r, how: seen}

# Ví dụ:
#   - {t: "00:12", group: HDT, state: y, how: seen}
#   - {t: "00:16", group: HDT, state: r, how: seen}
#   - {t: "00:18", group: LVL_straight, state: G, how: countdown}

right_turn_signal: null    # true nếu làn rẽ phải có đèn riêng; hiện ghi nhận là rẽ phải tự do
notes: null
