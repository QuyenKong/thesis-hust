# Field data for the study site. Every measured value comes from Viktor's own survey/video.
# Rule: values not yet measured stay `null` with `# TODO_MEASURE`. Code must raise on a required
# null, never substitute a default.

site_source: MEASURED          # MEASURED (this file) | LITERATURE_PROXY (config/site.proxy.yaml)

source:
  # OpenWebWizard export, immutable (never edit files under scenario_raw/)
  owz_dir: scenario_raw/2026-10-02-06-34-26
  osm_file: scenario_raw/2026-10-02-06-34-26/osm_bbox.osm.xml.gz

intersection:
  name: "Le Van Luong x Hoang Minh Giam x Nguyen Tuan"   # Viktor 2026-11-25: the study junction (was HDT by mistake)
  center_lonlat: [105.8003, 21.00225]   # OSM nodes LVL x NT x HMG (21.00232, 105.80023) / (21.00215, 105.80036), midpoint
  cut_radius_m: 190            # length of each approach kept; < 212 m keeps the Khuat Duy Tien underpass ramp of LVL
                               # (OSM ways 899919254/5) out (docs/research/site_lvl_nt_hmg.md)
  join_nodes: [320101377, 10617504197, 10538711449, 444501627]   # OSM nodes where the dual carriageways of LVL, HMG
                               # and NT cross (11.7-13.9 m from the centre); netconvert does not join them by itself
                               # (checked 2026-11-26 with --junctions.join-dist 20 and 25), so build_net joins them
                               # explicitly and puts the signal on the joined node

approaches:                    # LVL x HMG x NT (2026-11-26); edge <-> arm by bearing (build_net.ARM_BEARINGS)
  # Lane counts: Viktor 2026-11-26 (field). Lane movements: derived from that description (continuous right turn from
  # lane 0, lefts / U-turns only on LVL, from the leftmost lane); arrows not surveyed lane by lane.
  - id: LVL_W                  # Le Van Luong from the To Huu side (SW), towards the centre
    edge: "710360128#0"        # thesis_sumo.net.build 2026-11-26 (bearing rule, build_net.ARM_BEARINGS)
    lane_widths_m: [3.5, 3.5, 3.5, 3.5]   # 4 lanes = 3 mixed + the BRT lane, modelled as an ordinary lane (Viktor 26/11); # 3.5 m per lane: TCXDVN 104:2007 Table 10, secondary arterial (standard, not measured; docs/research/site_lvl_nt_hmg.md)
    lane_movements: [[r, s], [s], [s], [s, l, u]]
    left_turn_banned: false    # Viktor 2026-10-28 / 2026-11-26 (field): LVL -> Hoang Minh Giam permitted, protected left arrow
    u_turn_banned: false       # Viktor 2026-11-26 (field): U-turn permitted on LVL, in the left-arrow phase
    continuous_right_lane: true          # Viktor 26/11 + VTC News 16/01/2026 (chevron-marked continuous right LVL -> NT)
    right_turn_on_red: false             # not needed: the right turn is never red (continuous lane)
    right_lane_separator: open           # Viktor 2026-10-28 (field): no bollards, straight from lane 0 legal on green
    right_lane_length_m: 30              # Viktor 2026-10-29 (field): lane 0 is the right-turn lane over the last 30 m only
    sidewalk_width_m: null               # TODO_MEASURE (only needed on f2_measured_approaches)
    sidewalk_start_m: null               # TODO_MEASURE (f2_measured_approaches only, PLAN behaviour 7 / Phase 3B)
    sidewalk_speed_mps: null             # TODO_MEASURE (f2_measured_approaches only)
    bollard_length_m: null               # not used: right_lane_separator open
    hard_median_length_m: null           # TODO_MEASURE: hard median length before the stop line (0 if none)
  - id: LVL_E                  # Le Van Luong from the Lang Ha side (NE)
    edge: "711526328#7"        # thesis_sumo.net.build 2026-11-26 (bearing rule, build_net.ARM_BEARINGS)
    lane_widths_m: [3.5, 3.5, 3.5, 3.5]   # 4 lanes = 3 mixed + BRT lane as ordinary (Viktor 26/11); # 3.5 m per lane: TCXDVN 104:2007 Table 10, secondary arterial (standard, not measured; docs/research/site_lvl_nt_hmg.md)
    lane_movements: [[r, s], [s], [s], [s, l, u]]
    left_turn_banned: false    # Viktor 2026-10-28 / 2026-11-26 (field): LVL -> Nguyen Tuan permitted, protected left arrow
    u_turn_banned: false       # Viktor 2026-11-26 (field)
    continuous_right_lane: true          # Viktor 2026-11-26 (field)
    right_turn_on_red: false
    right_lane_separator: open           # Viktor 2026-10-28 (field)
    right_lane_length_m: 30              # Viktor 2026-10-29 (field)
    sidewalk_width_m: null               # TODO_MEASURE (only needed on f2_measured_approaches)
    sidewalk_start_m: null               # TODO_MEASURE (f2_measured_approaches only, PLAN behaviour 7 / Phase 3B)
    sidewalk_speed_mps: null             # TODO_MEASURE (f2_measured_approaches only)
    bollard_length_m: null               # not used: right_lane_separator open
    hard_median_length_m: null           # TODO_MEASURE: hard median length before the stop line (0 if none)
  - id: HMG                    # Hoang Minh Giam (NW)
    edge: "1304254918"         # thesis_sumo.net.build 2026-11-26 (bearing rule, build_net.ARM_BEARINGS)
    lane_widths_m: [3.5, 3.5, 3.5]        # 3 lanes (Viktor 26/11; OSM has 1, the start of HMG was widened, VTC News 16/01/2026); # 3.5 m per lane: TCXDVN 104:2007 Table 10, secondary arterial (standard, not measured; docs/research/site_lvl_nt_hmg.md)
    lane_movements: [[r, s], [s], [s]]
    left_turn_banned: true     # Viktor 2026-10-28 / 2026-11-26 (field): HMG -> LVL (left) banned
    u_turn_banned: true        # Viktor 2026-11-26 (field): no U-turn on HMG / NT
    continuous_right_lane: true          # Viktor 2026-11-26 (field): lane 0 continuous right
    right_turn_on_red: false
    right_lane_separator: open           # assumed same as LVL (Viktor 2026-10-28 described no bollards at the junction)
    right_lane_length_m: 30              # assumed same as LVL (Viktor 2026-10-29)
    sidewalk_width_m: null               # TODO_MEASURE (only needed on f2_measured_approaches)
    sidewalk_start_m: null               # TODO_MEASURE (f2_measured_approaches only, PLAN behaviour 7 / Phase 3B)
    sidewalk_speed_mps: null             # TODO_MEASURE (f2_measured_approaches only)
    bollard_length_m: null               # not used: right_lane_separator open
    hard_median_length_m: null           # TODO_MEASURE: hard median length before the stop line (0 if none)
  - id: NT                     # Nguyen Tuan (SE)
    edge: "710360129#0"        # thesis_sumo.net.build 2026-11-26 (bearing rule, build_net.ARM_BEARINGS)
    lane_widths_m: [3.5, 3.5, 3.5]        # 3 lanes (Viktor 26/11; OSM 2); # 3.5 m per lane: TCXDVN 104:2007 Table 10, secondary arterial (standard, not measured; docs/research/site_lvl_nt_hmg.md)
    lane_movements: [[r, s], [r, s], [s]]   # right turn from lanes 0-1: riders turn right two abreast in IMG_4801 (decision D21)
    left_turn_banned: true     # Viktor 2026-10-28 / 2026-11-26 (field): NT -> LVL (left) banned
    u_turn_banned: true        # Viktor 2026-11-26 (field)
    continuous_right_lane: false         # Viktor 2026-11-26 (field): no continuous right-turn lane on NT
    right_turn_on_red: true              # Viktor 2026-11-26 (field): right turn allowed on red (stop, then go: SUMO link state 's')
    sidewalk_width_m: null               # TODO_MEASURE (only needed on f2_measured_approaches)
    sidewalk_start_m: null               # TODO_MEASURE (f2_measured_approaches only, PLAN behaviour 7 / Phase 3B)
    sidewalk_speed_mps: null             # TODO_MEASURE (f2_measured_approaches only)
    bollard_length_m: null               # not used: right_lane_separator open
    hard_median_length_m: null           # TODO_MEASURE: hard median length before the stop line (0 if none)

exits:                         # outbound edges of the target junction; their widths are also the box widths
  - id: LVL_W_out
    edge: "710360126"          # thesis_sumo.net.build 2026-11-26 (bearing rule, build_net.ARM_BEARINGS)
    lane_widths_m: [3.5, 3.5, 3.5, 3.5]   # PROVISIONAL: assumed = inbound LVL (Viktor gave inbound counts only); # 3.5 m per lane: TCXDVN 104:2007 Table 10, secondary arterial (standard, not measured; docs/research/site_lvl_nt_hmg.md)
  - id: LVL_E_out
    edge: "710360127#0"        # thesis_sumo.net.build 2026-11-26 (bearing rule, build_net.ARM_BEARINGS)
    lane_widths_m: [3.5, 3.5, 3.5, 3.5]   # PROVISIONAL, as LVL_W_out
  - id: HMG_out
    edge: "1130829742#0"       # thesis_sumo.net.build 2026-11-26 (bearing rule, build_net.ARM_BEARINGS)
    lane_widths_m: [3.5, 3.5, 3.5]       # 3 lanes: Viktor 2026-11-26 (field: NT -> HMG direction has 3 lanes); 3.5 m TCXDVN 104:2007 (standard)
  - id: NT_out
    edge: "1130838748#0"       # thesis_sumo.net.build 2026-11-26 (bearing rule, build_net.ARM_BEARINGS)
    lane_widths_m: [3.5, 3.5]             # PROVISIONAL: OSM 2; NT is 4 lanes (2 per direction), Lao Dong 15/08/2024

signal:
  type: static
  cycle_s: 160.0               # measured 2026-11-25 PM, IMG_4801: pedestrian head (Dat Bike corner) green onsets
                               # 39.5 s and 199.5 s, green 33 s each (video/runs/V2_IMG_4801/light_rgb.csv)
  # Split phasing on LVL (Viktor 2026-11-27, field: each LVL approach gets its own green for straight + left + U-turn,
  # NT-HMG straight 40 s in between). Order and greens measured from the IMG_4801 tracking (video/runs/V2_IMG_4801/
  # od_tracks.csv, 2 cycles; figure + analysis in docs/DECISIONS_2026-11-27.md D30): LVL_E straight and left discharge
  # together (~0-45 s, 152-205 s), then NT (44-85 s, 205-245 s; NT green onset = pedestrian green onset 39.5 / 199.5 s),
  # then LVL_W straight (88-143 s, 256-303 s); each repeats after 160-161 s. Supersedes the 3-stage plan of 2026-11-26.
  stage_totals_s:              # stage length incl. its yellow + all-red; sum = cycle_s
    LVL_E: 55                  # green 50 s: discharge window ~50 s (tracking); Viktor 27/11: LVL green 53-60 s, red 107-115 s
    cross: 45                  # green 40 s: Viktor 27/11 (NT-HMG green 40 s, red 115 s); tracking NT discharge ~40 s
    LVL_W: 60                  # green 55 s: discharge window ~55 s (tracking)
  stage_order: [LVL_E, cross, LVL_W]   # measured order (tracking IMG_4801), Viktor 2026-11-27
  yellow_s: 3                  # ASSUMED (vehicle heads not visible in either video; owner choice 2026-11-27, D30); TODO_MEASURE
  all_red_s: 2                 # ASSUMED (same as before); TODO_MEASURE
  # green = stage total - yellow - all-red: 50 / 40 / 55 s; sum with intergreens = 160 s.
  # Approach ids HMG / NT are the new junction's (migration of 2026-11-26: HDT_N -> HMG, HDT_S -> NT).
  phases:
    - {name: LVL_E_green, duration_s: 50, green_movements: [LVL_E:r, LVL_E:s, LVL_E:l, LVL_E:t], yellow_movements: []}
    - {name: LVL_E_yellow, duration_s: 3, green_movements: [], yellow_movements: [LVL_E:r, LVL_E:s, LVL_E:l, LVL_E:t]}
    - {name: LVL_E_allred, duration_s: 2, green_movements: [], yellow_movements: []}
    - {name: cross_green, duration_s: 40, green_movements: [HMG:r, HMG:s, HMG:l, NT:r, NT:s, NT:l], yellow_movements: []}
    - {name: cross_yellow, duration_s: 3, green_movements: [], yellow_movements: [HMG:r, HMG:s, HMG:l, NT:r, NT:s, NT:l]}
    - {name: cross_allred, duration_s: 2, green_movements: [], yellow_movements: []}
    - {name: LVL_W_green, duration_s: 55, green_movements: [LVL_W:r, LVL_W:s, LVL_W:l, LVL_W:t], yellow_movements: []}
    - {name: LVL_W_yellow, duration_s: 3, green_movements: [], yellow_movements: [LVL_W:r, LVL_W:s, LVL_W:l, LVL_W:t]}
    - {name: LVL_W_allred, duration_s: 2, green_movements: [], yellow_movements: []}
  # HMG:l / NT:l are the banned lefts, open to illegal_left.vclass only (apply_patches): yielding green in their own
  # approach's green, as on the proxy net (test_illegal_left_green_in_own_through_phase); tracking IMG_4801 shows the
  # NT illegal lefts inside NT green (78-87 s)
  # evidence: cycle measured (pedestrian head, video); order + green lengths measured (tracking, 2 cycles, +-3 s);
  # NT-HMG 40 s also Viktor field 27/11; yellow 3 s and all-red 2 s assumed

illegal_left:
  approaches: [HMG, NT]        # left banned on both (Viktor 26/11); illegal lefts NT -> LVL_W seen in IMG_4801 tracking (draft)
  vclass: custom1
  mode: native                 # Phase 3 decision (docs/research/phase3_box_capacity.md; box_edge not implemented),
                               # same as site.proxy.yaml; re-check against the measured box counts (M7a) once counted

violator_classes:              # vClasses of the violator vTypes; only they may use the violator-only connections
  moto: custom1                # moto_violator: banned left turn, sidewalk lane
  car: custom2                 # car_violator
violator_turn_lanes:           # Viktor 2026-10-29 (field, not measured; report/2026-10-29 DECISIONS V3): violators turn left
  l: [0]                       # from lane 0 (where the left is not banned) and make U-turns from lanes 0 and 1. Since
  u: [0, 1]                    # 2026-11-04 no connection: the wrong_lane option of queue_space_seeking rides that lane and
                               # cuts back to the marked lane over the last right_lane_length_m (PLAN 4.5)
f2_measured_approaches: null   # TODO_MEASURE: 1-2 approaches used to measure F2 (camera sees 50-100 m of queue and the
                               # sidewalk); the sidewalk lane (PLAN 1.4) is built only on these
