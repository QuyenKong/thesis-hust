# Experiment design. These are modelling choices, not field measurements.
# `null` + `# TODO_DECIDE` = Viktor still has to choose; code must raise when it needs one.

sim:
  begin_s: 0
  end_s: 3600                  # full AM-peak hour (explicit --end 3600)
  calib_end_s: 1800            # R31: 07:30-08:00; loop, Optuna and benchmark all use it; 3600 s PROXY runs take
                               # 20+ min. runner.run / the CLI use it when no explicit sim_end_s / --end is given
  step_length_s: 0.1
  lateral_resolution_m: 0.4
  fcd_radius_m: 120            # fcd output is filtered to this radius around the intersection centre
                               # (must cover observation.queue_range_m + stop line distance, ~24 m)
  device_rerouting: false
  ssm:
    mode: "off"                # R22: off | violators | all (quoted: YAML reads a bare off as false).
                               # off for calibration, LLM loop and Optuna; violators (--device.ssm.explicit =
                               # moto_violator ids) for the benchmark PET diagnostic subset; all = every vehicle
  aggregate_warnings: 20       # R22: sumo --aggregate-warnings (summarise a warning type after 20 lines); never -W

seeds:
  dev: [1, 2, 3]               # Phase 2 baseline check
  benchmark_n: 20              # Phase 7: >= 20 seeds on validation days

observation:
  # Modelling choice, not a measurement: upstream distance from the stop line within which queues, lateral
  # positions and range entries are observed (queue_snapshots, lateral_snapshots, traversals). Replace with the
  # camera's measured upstream coverage once the video exists. Queues reaching it are censored (capped).
  queue_range_m: 80
  metric_window_s: [300, 1800]   # R31: metrics M1-M8 on [300, 1800) s on both sides (300 s warm-up)

backend: libsumo               # libsumo (fast, batch runs) | traci (needed for sumo-gui debugging)

budget:
  sumo_runs: null              # TODO_DECIDE: same budget for LLM loop and Optuna

data_split:
  # LITERATURE_PROXY days (data/observed/PROXY_D*, generated by thesis_sumo.proxy.generate, spec 4.2); replace
  # with measured days once video exists
  calibration_days: [PROXY_D1, PROXY_D2, PROXY_D3]
  validation_days: [PROXY_D4, PROXY_D5]   # LLM/Optuna never see these

score:
  # Task 10 plan: equal weight per metric group (controller's call, open to Viktor); renormalised over the groups
  # that have scored keys, split equally over sub-metrics (M7a/b/c) and keys (metrics.distance.split_weights)
  weights: {M1: 1, M2: 1, M3: 1, M4: 1, M5: 1, M6: 1, M7: 1, M8: 1}
  geh_gate:
    threshold: 5
    min_share: 0.85

validity:
  # Run eligibility for "best spec" selection (thesis_sumo.sim.runner.is_eligible); `valid_strict` in the
  # manifest stays "no teleport and no collision at all". The GEH gate is added in Task 11.
  max_noncollision_teleports: 0
  max_end_backlog: 0
  # R28: --collision.check-junctions is on in every run; lane and junction collisions are counted apart
  # (manifest n_collisions_lane / n_collisions_junction) and capped separately.
  max_collisions_per_hour: null  # lane collisions. Old value 3 (R24, Task 4b: max(2, ceil(p90)) of 9 B0 rates on
                                 # PROXY_D1-D3) was derived WITHOUT check-junctions; being re-derived by the operator
                                 # under R28 (B0 PROXY_D1-D3 x seeds 1,2,3, check-junctions on) before round 1
  max_junction_collisions_per_hour: null  # re-derived by operator under R28 (B0-derived max(2, ceil(p90)))
  max_intervened_collisions: 1
