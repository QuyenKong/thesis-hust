    lane_movements_evidence: assumed
    left_turn_banned: false
    left_turn_banned_source: "assumed: OSM has l-connections and no restriction relation at this junction [S3]; no ban found in news"
    left_turn_banned_evidence: assumed
    u_turn_banned: false
    u_turn_banned_source: "assumed: OSM has t-connections and no restriction relation at this junction [S3]; no ban found in news"
