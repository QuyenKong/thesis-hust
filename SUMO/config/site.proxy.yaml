    u_turn_banned: false
    u_turn_banned_source: "assumed: OSM has t-connections and no restriction relation at this junction [S3]; no ban found in news"
    u_turn_banned_evidence: assumed
    continuous_right_lane: true
    continuous_right_lane_source: "Viktor, field visit (PLAN 0 'Ha tang da xac nhan'): every approach has a continuous right-turn lane, the outermost right lane, not signal controlled. Modelling assumption (Task F2-net, thesis_sumo.net.apply_patches; Viktor may change it): it is the existing OSM lane 0, no lane is added"
    continuous_right_lane_evidence: field_observation
    right_lane_separator: bollards
    right_lane_separator_source: "Viktor, 2026-10-26 (answer to the F2-net question): the continuous right-turn lane is separated from the through lanes by bollards / a hard separator, so nobody goes straight from it (none | paint | bollards)"
    right_lane_separator_evidence: field_observation
    sidewalk_width_m: 3.0
