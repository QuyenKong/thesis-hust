# Phases: green_movements / yellow_movements are "<approach_id>:<dir>", dir = SUMO connection dir
# (r right, s straight, l left, t turnaround). Movements not listed are red. Durations sum to cycle_s.
# Three stages (Viktor 2026-10-28, field): LVL straight; LVL protected left (both LVL lefts together, LVL straight
# red); Hoang Minh Giam / Nguyen Tuan (HDT_N / HDT_S). HDT_N:l and HDT_S:l are banned: they stay in the HDT green
# phase as the custom1-only (illegal) links (PLAN 1.4). The LVL U-turns (lane 2, like the left) go with the left arrow.
# The `:r` entries of continuous_right_lane approaches are not used: that link is `g` (green, yield) in every
# phase (PLAN 1.4); they are kept so that continuous_right_lane: false gives the signal-controlled right turn back.
signal:
  type: static
  cycle_s: 120
  cycle_s_source: "[S2] TCCS 24:2018/TCDBVN cl. 6.7.5 (cycle normally 60-90 s, special cases up to 120 s); [S5] Mai et al. 2019 measured 127 s at Lang Ha x Lang (same corridor, 3-lane major road) and 70 s at a 2-lane junction"
  cycle_s_evidence: literature_transferred
  cycle_s_transfer_note: "site: 120 s is the top of the TCCS normal range, chosen because the measured cycle at Lang Ha x Lang (another junction on the corridor) is 127 s"
  phases:
    - name: LVL_straight
      duration_s: 42
      green_movements: [LVL_W:r, LVL_W:s, LVL_E:r, LVL_E:s]
      yellow_movements: []
    - name: LVL_straight_yellow
      duration_s: 4
      green_movements: []
      yellow_movements: [LVL_W:r, LVL_W:s, LVL_E:r, LVL_E:s]
    - name: LVL_straight_allred
      duration_s: 2
      green_movements: []
      yellow_movements: []
    - name: LVL_left
      duration_s: 16
      green_movements: [LVL_W:l, LVL_W:t, LVL_E:l, LVL_E:t]
      yellow_movements: []
    - name: LVL_left_yellow
      duration_s: 4
      green_movements: []
      yellow_movements: [LVL_W:l, LVL_W:t, LVL_E:l, LVL_E:t]
    - name: LVL_left_allred
      duration_s: 2
      green_movements: []
      yellow_movements: []
    - name: HDT_green
      duration_s: 44
      green_movements: [HDT_N:r, HDT_N:s, HDT_N:l, HDT_N:t, HDT_S:r, HDT_S:s, HDT_S:l, HDT_S:t]
      yellow_movements: []
    - name: HDT_yellow
      duration_s: 4
      green_movements: []
      yellow_movements: [HDT_N:r, HDT_N:s, HDT_N:l, HDT_N:t, HDT_S:r, HDT_S:s, HDT_S:l, HDT_S:t]
    - name: HDT_allred
      duration_s: 2
      green_movements: []
      yellow_movements: []
  phases_source: "stage structure: Viktor 2026-10-28 (field, not measured): protected left arrow for both LVL lefts, LVL straight red during it; yellow 4 s: [S2] cl. 6.7.6 (4 s for V <= 60 km/h, OSM maxspeed 60 [S3]); all-red 2 s: assumed; green splits 42 / 16 / 44 s: assumed (the former LVL green of 64 s split into straight 42 s and left 16 s plus one more intergreen of 6 s; HDT green unchanged; durations TODO_MEASURE)"
  phases_evidence: assumed

illegal_left:
  approaches: [HDT_N, HDT_S]
  approaches_source: "assumed: the two left_turn_banned approaches (Viktor 2026-10-28: bans only on Hoang Minh Giam -> LVL and Nguyen Tuan -> LVL); that violators turn left there and wait in the box is assumed from box-waiting by motorcycles observed at Hanoi signalised junctions [S5]"
  approaches_evidence: assumed
  vclass: custom1
  mode: native
  mode_source: "measured on the LVL_W left (the illegal-left approach before 2026-10-28), not yet re-checked on the HDT_N / HDT_S lefts: experiments/phase3/box_capacity.py (results_native.csv), ../docs/research/phase3_box_capacity.md: native SUMO box capacity 8 halting moto_violators with B0 vTypes (5 seeds x 900 s) >= M7 target mean 6 (data/proxy/targets.yaml); target p90 10 reached with custom1 minGap 1.8 m (measured 10) and exceeded at 1.0 m (measured 12)"
  mode_evidence: experiment

violator_classes:              # vClasses of the violator vTypes (PLAN 0; not field data, same as config/site.yaml)
  moto: custom1
  car: custom2
f2_measured_approaches: [LVL_W, LVL_E]
f2_measured_approaches_source: "Viktor, 2026-10-28 (field, not measured): riders use the sidewalk on Le Van Luong in both directions, LVL_W to go straight or right into Nguyen Tuan, LVL_E to go straight or right into Hoang Minh Giam; sidewalk geometry assumed (ruling R39)"
f2_measured_approaches_evidence: assumed
