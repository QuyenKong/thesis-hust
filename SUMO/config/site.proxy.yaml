# exits: the four outbound edges of the target junction, id = <id of the approach on the same arm>_out.
# lane_widths_m as for approaches (index 0 = rightmost). netconvert gives every internal lane of a link the
# width of its outbound lane, so these widths are also the widths inside the junction box (ruling R21).
exits:
  - id: LVL_W_out
    edge: "711526328#0"        # out to SW (scenario/net/edge_table.csv)
    lane_widths_m: [3.5, 3.5, 3.5]
    lane_widths_m_source: "[S1] TCVN 13592:2022 cl. 9.2.3 Table 10 (main street 3.50 m; BRT lane >= 3.50 m); lane count [S3] OSM, [S4] VietnamFinance 2026"
    lane_widths_m_evidence: literature
