# LITERATURE PROXY for the study site -- NOT field data.
# Same structure as config/site.yaml. Values that are `null # TODO_MEASURE` in site.yaml are filled
# here from published sources or explicit assumptions, each with sibling keys
#   <key>_source   : citation (ids [S..] refer to ../docs/research/proxy_sources.md)
#   <key>_evidence : literature | literature_transferred | assumed (ruling R13; literature_transferred =
#                    from a source but transferred across site, denominator or country, with <key>_transfer_note)
#                    | experiment (a modelling choice, TODO_DECIDE in site.yaml, taken by an experiment of this repo;
#                    allowed only on thesis_sumo.config.EXPERIMENT_EVIDENCE_KEYS)
#                    | field_observation (confirmed by Viktor on site but not measured; allowed only on
#                    thesis_sumo.config.FIELD_OBSERVATION_EVIDENCE_KEYS)
# Any result built from this file must be reported as site_source: LITERATURE_PROXY.
# Replace with real measurements by editing config/site.yaml, never this file.

site_source: LITERATURE_PROXY

source:
  # OpenWebWizard export, immutable (never edit files under scenario_raw/)
  owz_dir: scenario_raw/2026-10-02-06-34-26
  osm_file: scenario_raw/2026-10-02-06-34-26/osm_bbox.osm.xml.gz

intersection:
  name: "Le Van Luong x Hoang Dao Thuy"
  center_lonlat: [105.8047, 21.0053]
  cut_radius_m: 300

# lane_widths_m: one entry per lane, list index = SUMO lane index (0 = rightmost).
# lane_movements: per lane (same index), the movements its markings permit (turn_counts codes r/s/l/u;
# a banned left is in no lane). Used by M8 (wrong-lane share, ruling R9).
# continuous_right_lane: lane 0 is the continuous right-turn lane: its right turn is green (yield) in every phase and
# its straight connection exists only for the violator classes (thesis_sumo.net.apply_patches).
# Lane count 3 per approach from OSM (lanes=3 on all four approach ways); Le Van Luong's leftmost
# lane is the BRT lane (OSM psv:lanes=designated|yes|yes) [S3][S4].
approaches:
  - id: LVL_W
    edge: "711526326#1"        # arm from SW (To Huu side), heading NE = AM inbound (Task 2, scenario/net/edge_table.csv)
    lane_widths_m: [3.5, 3.5, 3.5]
    lane_widths_m_source: "[S1] TCVN 13592:2022 cl. 9.2.3 Table 10 (main street 3.50 m; BRT lane >= 3.50 m); lane count [S3] OSM, [S4] VietnamFinance 2026"
    lane_widths_m_evidence: literature
    lane_movements: [[r], [s], [s, u]]
    lane_movements_source: "assumed: lane markings at LVL x HDT unknown (OSM approach ways have no turn:lanes tag [S3]); follows the netconvert connection layout of site.proxy.net.xml (left and U-turn from lane 2, straight from lanes 1-2); lane 0 = the continuous right-turn lane (continuous_right_lane, PLAN 0), right turn only"
    lane_movements_evidence: assumed
    left_turn_banned: true
    left_turn_banned_source: "assumed: no source found on turn bans at LVL x HDT [S3][S9]; Hanoi bans left turns at nearby arterial junctions [S9][S10]; inbound AM-peak LVL approach chosen as the focus approach"
    left_turn_banned_evidence: assumed
    u_turn_banned: false
    u_turn_banned_source: "assumed: OSM has t-connections and no restriction relation at this junction [S3]; no ban found in news"
    u_turn_banned_evidence: assumed
    continuous_right_lane: true
    continuous_right_lane_source: "Viktor, field visit (PLAN 0 'Ha tang da xac nhan'): every approach has a continuous right-turn lane, the outermost right lane, not signal controlled. Modelling assumption (Task F2-net, thesis_sumo.net.apply_patches; Viktor may change it): it is the existing OSM lane 0, no lane is added"
    continuous_right_lane_evidence: field_observation
    right_lane_separator: bollards
    right_lane_separator_source: "Viktor, 2026-10-26 (answer to the F2-net question): the continuous right-turn lane is separated from the through lanes by bollards / a hard separator, so nobody goes straight from it (none | paint | bollards)"
    right_lane_separator_evidence: field_observation
    sidewalk_width_m: null         # no source: kept null (the sidewalk lane is built only on f2_measured_approaches)
    hard_median_length_m: null     # no source: kept null (wrong-way driving, PLAN behaviour 8, waits for Phase 3C)
