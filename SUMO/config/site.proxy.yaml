    right_lane_separator_evidence: field_observation
    sidewalk_width_m: null         # no source: kept null (the sidewalk lane is built only on f2_measured_approaches)
    hard_median_length_m: null     # no source: kept null (wrong-way driving, PLAN behaviour 8, waits for Phase 3C)
  - id: HDT_N
    edge: "953158817#2"        # arm from NW; includes unnamed OSM way 1071601648 (= HDT, Task 2)
    lane_widths_m: [3.5, 3.5, 3.5]
    lane_widths_m_source: "[S1] TCVN 13592:2022 cl. 9.2.3 Table 10 (main street 3.50 m); HDT taken as main street (OSM highway=primary, maxspeed 60) [S3]; lane count [S3]"
    lane_widths_m_evidence: literature
    lane_movements: [[r], [s], [s, l, u]]
